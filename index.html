<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="./style.css">
</head>


<body>
    <div id="app"></div>


    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        function App(){
            const [clipName, setClipName] = React.useState("");
            const [volume, setVolume] = React.useState(0.75);

            React.useEffect(() => {
                const handleKeyDown = (event) => {
                    const audio = document.getElementById(event.key.toUpperCase());
                    const elt = audio.parentElement;
                    if (!audio) return;
                    audio.currentTime = 0;
                    audio.volume = volume;
                    const p = audio.play();
                    setClipName(elt.id);
                    flashPad(elt);
                }

                document.addEventListener('keydown', handleKeyDown);

                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                };
            }, [volume]);


            const handlePadClick = (event) => {
                const audio = event.currentTarget.querySelector('audio');
                if (!audio) return;
                audio.currentTime = 0;
                audio.volume = volume;
                const p = audio.play();
                setClipName(event.currentTarget.id);
                flashPad(event.currentTarget);
            };

            const flashPad = (pad) => {
                if(!pad) return null;
                pad.classList.add('active');
                setTimeout(() => {
                    pad.classList.remove('active');
                }, 150);
            }

            return(
                <div id="drum-machine">
                    <div id="pads">
                        <button id="Heater-1" className="drum-pad" onClick={handlePadClick}>
                            Q
                            <audio className="clip" id="Q" src="./Sounds/Heater-1.mp3"></audio>
                        </button>
                        <button id="Heater-2" className="drum-pad" onClick={handlePadClick}>
                            W
                            <audio className="clip" id="W" src="./Sounds/Heater-2.mp3"></audio>    
                        </button>
                        <button id="Heater-3" className="drum-pad" onClick={handlePadClick}>
                            E
                            <audio className="clip" id="E" src="./Sounds/Heater-3.mp3"></audio>   
                        </button>
                        <button id="Heater-4" className="drum-pad" onClick={handlePadClick}>
                            A
                            <audio className="clip" id="A" src="./Sounds/Heater-4.mp3"></audio>   
                        </button>
                        <button id="Clap" className="drum-pad" onClick={handlePadClick}>
                            S
                            <audio className="clip" id="S" src="./Sounds/Clap.mp3"></audio>   
                        </button>
                        <button id="Open-HH" className="drum-pad" onClick={handlePadClick}>
                            D
                            <audio className="clip" id="D" src="./Sounds/Open-HH.mp3"></audio>   
                        </button>
                        <button id="Kick-n'-Hat" className="drum-pad" onClick={handlePadClick}>
                            Z
                            <audio className="clip" id="Z" src="./Sounds/Kick-n-Hat.mp3"></audio>   
                        </button>
                        <button id="Kick" className="drum-pad" onClick={handlePadClick}>
                            X
                            <audio className="clip" id="X" src="./Sounds/Kick.mp3"></audio>   
                        </button>
                        <button id="Closed-HH" className="drum-pad" onClick={handlePadClick}>
                            C
                            <audio className="clip" id="C" src="./Sounds/Closed-HH.mp3"></audio>   
                        </button>
                    </div>
                    <div id="display">
                        <div id="pad-info">
                            <h1>Clip name: {clipName}</h1>
                            <h3>Volume:</h3>
                            <div id="volume">
                                <input id="volume-slider" type="range" min="0" max="1" step="0.01" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))}/>
                            </div>
                        </div>
                        <p id="by-me">By: Anthony Newsome</p>
                    </div>
                </div>
            );
        }


        ReactDOM.render(<App />, document.getElementById('app'));
    </script>



    <!-- FCC test menu -->
    <!--<script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>-->
</body>

</html>
